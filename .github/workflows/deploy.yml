name: Deploy to GitHub Pages
on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build
        env:
          # The app's ID from the Bazaar dashboard (repository variable)
          VITE_APP_ID: ${{ vars.BENEFACTOR_APP_ID }}
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
          # GitHub Pages has no SPA fallback; serve the app for deep links
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
